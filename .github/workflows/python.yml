name: Python Package CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.7", "3.8", "3.9", "3.10", "3.11", "3.12"]
        pandas-version: ["pandas<2.0", "pandas>=2.0"]
        numpy-version: ["numpy<2.0", "numpy>=2.0"]
        exclude:
          - python-version: "3.7"
            pandas-version: "pandas>=2.0"
          - python-version: "3.7"
            numpy-version: "numpy>=2.0"
          - python-version: "3.8"
            pandas-version: "pandas>=2.0"
          - python-version: "3.8"
            numpy-version: "numpy>=2.0"
          - python-version: "3.9"
            pandas-version: "pandas<2.0"
          - python-version: "3.10"
            pandas-version: "pandas<2.0"
          - python-version: "3.11"
            pandas-version: "pandas<2.0"
          - python-version: "3.11"
            numpy-version: "numpy>=2.0"
          - python-version: "3.12"
            pandas-version: "pandas<2.0"
          - python-version: "3.12"
            numpy-version: "numpy<2.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify that code is formatted
        run: |
          pip install black
          black --check .

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Run tests
        run: |
          pytest

      - name: Install extra dependencies
        run: |
          pip install "${{ matrix.pandas-version }}" "${{ matrix.numpy-version }}"

      - name: Rerun tests with extra dependencies
        run: |
          pytest

      - name: Build package
        run: |
          python -m pip install wheel
          python setup.py sdist bdist_wheel